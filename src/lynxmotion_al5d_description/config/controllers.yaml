# ros2_control configuration for the simulated Lynxmotion AL5D.
# Loaded by gz_ros2_control (see the <plugin> in urdf/lynxmotion_al5d.xacro); everything
# lives in the /lynxmotion_al5d namespace, as in the ROS 1 version.
/lynxmotion_al5d:
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz (matches the 1 ms simulation step)
      use_sim_time: true

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      # Low-level controller for all eight actuated joints. Do not command it directly:
      # publish six values to /lynxmotion_al5d/joints_positions/commands and command_relay
      # derives the two finger positions from the Gripper opening.
      arm_controller:
        type: forward_command_controller/ForwardCommandController

  arm_controller:
    ros__parameters:
      joints:
        - Joint1
        - Joint2
        - Joint3
        - Joint4
        - Joint5
        - Gripper
        - right_finger_joint
        - left_finger_joint
      interface_name: position

  joint_state_broadcaster:
    ros__parameters:
      use_sim_time: true
