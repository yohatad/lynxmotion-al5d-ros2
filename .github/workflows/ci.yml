name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        working-directory: jazzy
        run: docker build -t rpp-jazzy .
      - name: Build and test everything (including the Gazebo simulation tests)
        run: docker run --rm --shm-size=1g rpp-jazzy test
